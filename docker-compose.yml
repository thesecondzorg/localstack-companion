version: "3.8"

services:
  # LocalStack container
  localstack:
    image: localstack/localstack:3.4.0
    container_name: localstack_core
    ports:
      - "4567:4566" # Internal LocalStack port
    environment:
      - ACTIVATE_PRO=0
      - DEBUG=0
      - AWS_DEFAULT_REGION=eu-west-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - localstack_data:/var/lib/localstack

  # LocalStack Companion Wrapper & Web UI
  companion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localstack_companion
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - "4566:4566" # Standard AWS endpoint + Web UI at http://localhost:4566/ui
      - "8080:4566" # Convenient UI port at http://localhost:8080
    environment:
      - LOCALSTACK_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=eu-west-1
      - CONFIG_PATH=/app/resources.yaml
      - AUTO_CREATE_MISSING=false
    volumes:
      - ./resources.yaml:/app/resources.yaml

volumes:
  localstack_data:

